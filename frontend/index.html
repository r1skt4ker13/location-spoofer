<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #6b7280; --border: #e3e5e9;
    --accent: #2563eb; --good: #15803d; --mid: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9aa1ad; --border: #2a2f39;
      --accent: #60a5fa; --good: #4ade80; --mid: #fbbf24; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 20px; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 16px; padding: 0 20px 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  #list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 140px); overflow: auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .card.selected { border-color: var(--accent); }
  .card .row { display: flex; justify-content: space-between; gap: 8px; }
  .card .title { font-weight: 600; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .score.good { color: var(--good); } .score.mid { color: var(--mid); } .score.bad { color: var(--bad); }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); }
  #detail { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; max-height: calc(100vh - 140px); overflow: auto; }
  #detail h2 { margin: 0 0 4px; font-size: 18px; }
  #detail h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  ul.bullets { margin: 0; padding-left: 18px; }
  pre { white-space: pre-wrap; font: inherit; margin: 0; background: var(--bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Job Agent</h1>
    <div class="meta" id="runMeta">Loading…</div>
  </div>
  <button class="primary" id="runBtn">Run now</button>
</header>

<div class="toolbar">
  <div class="tabs" id="tabs">
    <button data-status="drafted" class="active">Ready to apply</button>
    <button data-status="scored">Scored</button>
    <button data-status="applied">Applied</button>
    <button data-status="skipped">Skipped</button>
    <button data-status="filtered">Filtered out</button>
    <button data-status="">All</button>
  </div>
  <select id="category" class="meta"><option value="">All categories</option></select>
  <label class="meta">Min score <input type="number" id="minScore" min="0" max="100" value="" style="width:60px" /></label>
  <span class="meta" id="counts"></span>
</div>

<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a job</div></div>
</main>

<script>
const state = { status: "drafted", jobs: [], selectedId: null, wasRunning: false };

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c instanceof Node ? c : String(c));
  return node;
}

function scoreClass(s) { return s == null ? "" : s >= 70 ? "good" : s >= 45 ? "mid" : "bad"; }

function safeUrl(u) {
  try { const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:" ? p.href : null; }
  catch { return null; }
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

async function loadJobs() {
  const params = new URLSearchParams();
  if (state.status) params.set("status", state.status);
  const min = document.getElementById("minScore").value;
  if (min !== "") params.set("min_score", min);
  const cat = document.getElementById("category").value;
  if (cat) params.set("category", cat);
  state.jobs = await api(`/api/jobs?${params}`);
  renderList();
  if (state.selectedId && !state.jobs.some(j => j.id === state.selectedId)) {
    state.selectedId = null;
    renderDetail(null);
  }
}

function renderList() {
  const list = document.getElementById("list");
  list.replaceChildren();
  if (!state.jobs.length) { list.append(el("div", { class: "empty" }, "No jobs here yet.")); return; }
  for (const j of state.jobs) {
    list.append(el("div", {
      class: "card" + (j.id === state.selectedId ? " selected" : ""),
      onclick: () => { state.selectedId = j.id; renderList(); renderDetail(j); },
    },
      el("div", { class: "row" },
        el("div", { class: "title" }, j.title),
        el("div", { class: "score " + scoreClass(j.fit_score) }, j.fit_score ?? "–")),
      el("div", { class: "row meta" },
        el("span", {}, `${j.category ? j.category + " · " : ""}${j.company} · ${j.location || ""}`),
        el("span", {}, j.date_posted || "")),
    ));
  }
}

function copyBtn(label, text) {
  return el("button", { onclick: async (e) => {
    await navigator.clipboard.writeText(text);
    e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = label, 1200);
  } }, label);
}

async function setStatus(job, status) {
  await api(`/api/jobs/${job.id}/status`, { method: "POST", body: JSON.stringify({ status }) });
  await refresh();
}

async function draft(job, btn) {
  btn.disabled = true; btn.textContent = "Drafting…";
  try {
    const updated = await api(`/api/jobs/${job.id}/draft`, { method: "POST" });
    await loadJobs();
    renderDetail(updated);
  } catch (e) { alert("Draft failed: " + e.message); btn.disabled = false; btn.textContent = "Retry draft"; }
}

function renderDetail(j) {
  const d = document.getElementById("detail");
  d.replaceChildren();
  if (!j) { d.append(el("div", { class: "empty" }, "Select a job")); return; }

  const url = safeUrl(j.apply_url);
  const draftBtn = el("button", { onclick: (e) => draft(j, e.target) }, j.cover_letter ? "Regenerate draft" : "Generate draft");

  d.append(
    el("h2", {}, j.title),
    el("div", { class: "meta" }, `${j.company} · ${j.location || ""} · ${j.work_model || ""}`),
    el("div", { class: "actions" },
      url ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, el("button", { class: "primary" }, "Open application")) : null,
      j.status !== "applied" ? el("button", { onclick: () => setStatus(j, "applied") }, "Mark applied") : null,
      j.status !== "skipped" ? el("button", { onclick: () => setStatus(j, "skipped") }, "Skip") : null,
      draftBtn,
    ),
    j.filter_reason ? el("div", { class: "meta" }, `Filtered out: ${j.filter_reason}`) : null,
    el("h3", {}, `Fit score: ${j.fit_score ?? "not scored"}`),
    el("div", {}, j.fit_reasoning || "—"),
    el("h3", {}, "Details"),
    el("dl", { class: "facts" },
      ...[["Category", j.category], ["Posted", j.date_posted], ["Salary", j.salary], ["Grad window", j.grad_time],
          ["Company size", j.company_size], ["Industry", j.company_industry], ["Status", j.status]]
        .flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v || "—")])),
    el("h3", {}, "Qualifications"),
    el("div", {}, j.qualifications || "—"),
  );

  if (Array.isArray(j.resume_bullets) && j.resume_bullets.length) {
    d.append(
      el("h3", {}, "Tailored resume bullets"),
      el("ul", { class: "bullets" }, ...j.resume_bullets.map(b => el("li", {}, b))),
      el("div", { class: "actions" }, copyBtn("Copy bullets", j.resume_bullets.map(b => "• " + b).join("\n"))),
    );
  }
  if (j.cover_letter) {
    d.append(
      el("h3", {}, "Cover letter"),
      el("pre", {}, j.cover_letter),
      el("div", { class: "actions" }, copyBtn("Copy cover letter", j.cover_letter)),
    );
  }
}

async function loadStatus() {
  const s = await api("/api/status");
  const lr = s.last_run;
  const btn = document.getElementById("runBtn");
  btn.disabled = lr.running;
  btn.textContent = lr.running ? "Running…" : "Run now";
  let text = `Auto-runs every ${s.interval_hours}h · drafts at score ≥ ${s.fit_threshold}`;
  if (lr.running) text = "Scraping and scoring… " + text;
  else if (lr.error) text = `Last run failed: ${lr.error} · ` + text;
  else if (lr.finished_at) text = `Last run ${new Date(lr.finished_at).toLocaleString()} (${lr.result?.new ?? 0} new, ${lr.result?.filtered ?? 0} filtered) · ` + text;
  document.getElementById("runMeta").textContent = text;
  const c = s.counts;
  document.getElementById("counts").textContent =
    `${c.drafted || 0} ready · ${c.scored || 0} scored · ${c.applied || 0} applied · ${c.filtered || 0} filtered · ${c.new || 0} pending`;
  const sel = document.getElementById("category");
  if (sel.options.length === 1) for (const cat of s.categories || []) sel.append(el("option", { value: cat }, cat));
  if (state.wasRunning && !lr.running) loadJobs();
  state.wasRunning = lr.running;
}

async function refresh() { await Promise.all([loadJobs(), loadStatus()]); }

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.status = b.dataset.status;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  loadJobs();
});
document.getElementById("minScore").addEventListener("change", loadJobs);
document.getElementById("category").addEventListener("change", loadJobs);
document.getElementById("runBtn").addEventListener("click", async () => {
  await api("/api/run", { method: "POST" });
  loadStatus();
});

refresh();
setInterval(loadStatus, 5000);
setInterval(loadJobs, 60000);
</script>
</body>
</html>
